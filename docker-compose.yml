services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: navbat
      POSTGRES_USER: navbat
      POSTGRES_PASSWORD: ${DB_PASSWORD:-navbat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navbat -d navbat"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: navbat
      POSTGRES_USER: navbat
      POSTGRES_PASSWORD: ${DB_PASSWORD:-navbat}
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  media:
